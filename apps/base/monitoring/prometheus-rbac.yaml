apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: togglemaster
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: togglemaster-prometheus
  namespace: togglemaster
rules:
  - apiGroups: [""]
    resources:
      - endpoints
      - services
      - pods
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: togglemaster-prometheus
  namespace: togglemaster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: togglemaster-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: togglemaster