apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: togglemaster
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 1m
      # Chave PagerDuty padrão (sobrescrevível via secret ou variável de ambiente)
      pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'

    route:
      group_by: ['alertname', 'service']
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 2h
      receiver: 'default-receiver'
      routes:
        - match:
            severity: critical
          receiver: 'critical-receiver'
          continue: true
        - match:
            severity: warning
          receiver: 'chatops-receiver'

    receivers:
      - name: 'default-receiver'
        webhook_configs:
          - url: 'http://self-healing-service:5000/alerts'
            send_resolved: true

      - name: 'critical-receiver'
        # Dispara self-healing automaticamente
        webhook_configs:
          - url: 'http://self-healing-service:5000/alerts'
            send_resolved: true
        # Integração PagerDuty Events API v2
        pagerduty_configs:
          - routing_key: 'togglemaster-pagerduty-key-placeholder'
            severity: 'critical'
            send_resolved: true
            description: '{{ .CommonAnnotations.summary }}: {{ .CommonAnnotations.description }}'
            client: 'ToggleMaster Prometheus'
            client_url: 'http://localhost:9090'

      - name: 'chatops-receiver'
        webhook_configs:
          - url: 'http://self-healing-service:5000/alerts'
            send_resolved: true
