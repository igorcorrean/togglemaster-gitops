apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluation-service
  namespace: togglemaster
  labels:
    app: evaluation-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: evaluation-service
  template:
    metadata:
      labels:
        app: evaluation-service
    spec:
      serviceAccountName: evaluation-service-sa
      containers:
      - name: evaluation-service
        image: "271384503138.dkr.ecr.us-east-1.amazonaws.com/evaluation-service:latest"
        ports:
        - containerPort: 8004
        envFrom:
        - configMapRef:
            name: evaluation-service-config
        - secretRef:
            name: evaluation-service-secret
        resources:
          requests:
            cpu: "150m" # Um pouco mais de CPU por ser o "hot path" de alta performance
            memory: "128Mi"
          limits:
            cpu: "400m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8004
          initialDelaySeconds: 3
          periodSeconds: 5