apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: togglemaster
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: 271384503138.dkr.ecr.us-east-1.amazonaws.com/auth-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8001
        env:
        - name: DB_HOST_AUTH
          valueFrom:
            configMapKeyRef:
              name: auth-service-config
              key: DB_HOST_AUTH
        - name: DB_PORT_AUTH
          valueFrom:
            configMapKeyRef:
              name: auth-service-config
              key: DB_PORT_AUTH
        - name: DB_NAME_AUTH
          valueFrom:
            configMapKeyRef:
              name: auth-service-config
              key: DB_NAME_AUTH
        - name: PORT_AUTH
          valueFrom:
            configMapKeyRef:
              name: auth-service-config
              key: PORT_AUTH
        - name: DB_USER_AUTH
          valueFrom:
            secretKeyRef:
              name: auth-service-secret
              key: DB_USER_AUTH
        - name: DB_PASSWORD_AUTH
          valueFrom:
            secretKeyRef:
              name: auth-service-secret
              key: DB_PASSWORD_AUTH
        - name: DATABASE_URL_AUTH
          valueFrom:
            secretKeyRef:
              name: auth-service-secret
              key: DB_URL_AUTH
        - name: MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: auth-service-secret
              key: MASTER_KEY
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 20