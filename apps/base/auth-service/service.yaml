apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: togglemaster
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
spec:
  type: ClusterIP # Tipo exigido pelo enunciado do Tech Challenge
  selector:
    app: auth-service
  ports:
  - protocol: TCP
    port: 8001      # Porta do Serviço
    targetPort: 8001 # Porta exposta pelo contêiner Go