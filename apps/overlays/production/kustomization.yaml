apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: togglemaster-gitops
  namespace: flux-system
spec:
  interval: 5m                    # Reconcilia a cada 5 minutos
  sourceRef:
    kind: GitRepository
    name: togglemaster-gitops        # Referência ao GitRepository acima
  path: ./apps/overlays/production
  prune: true                     # Remove recursos deletados do Git
  wait: true                      # Aguarda recursos ficarem prontos
  timeout: 2m
  targetNamespace: togglemaster-prod # ⚠️ Namespace onde aplicar os recursos


# Injeta ConfigMap dinamicamente com os endpoints da AWS gerados pelo Terraform
configMapGenerator:
  - name: togglemaster-config
    literals:
      - AWS_REGION=us-east-1
      - REDIS_HOST=togglemaster-redis.gigmz6.0001.use1.cache.amazonaws.com:6379
      - SQS_QUEUE_URL=https://sqs.us-east-1.amazonaws.com/271384503138/togglemaster-events
      - DYNAMODB_TABLE=ToggleMasterAnalytics