name: 🚀 GitOps Pipeline - Auth Service (Build, Secret & GitOps Update)

on:
  push:
    branches: [ main ]
    paths: 
      - 'services/auth/**'       # Altere para o caminho do código Go do auth-service
  workflow_dispatch:

permissions:
  contents: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: auth-service
  EKS_CLUSTER_NAME: togglemaster-eks
  KUSTOMIZE_OVERLAY_PATH: apps/overlays/production

jobs:
  # ============================================
  # JOB 1: Build e Push da Imagem Docker no ECR
  # ============================================
  build-and-push:
    name: 🐳 Build and Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.set-tag.outputs.tag }}
      ecr-registry: ${{ steps.login-ecr.outputs.registry }}
    
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4
      
      - name: 🔑 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: 🔐 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: 🏷️ Set image tag
        id: set-tag
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
      
      - name: 🐳 Build, tag, and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.set-tag.outputs.tag }}
        run: |
          echo "🔨 Building Docker image..."
          # -f indica onde está o Dockerfile
          # O último argumento indica a pasta de contexto (onde estão go.mod, main.go, etc.)
          docker build --platform linux/amd64 \
            -f services/auth/Dockerfile \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            services/auth
          
          echo "📤 Pushing to ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  # ============================================
  # JOB 2: Sincronizar Secret no EKS
  # ============================================
  sync-secret:
    name: 🔒 Sync Secret to EKS
    runs-on: ubuntu-latest
    steps:
      - name: 🔑 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔄 Update Kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: 🚀 Apply auth-service-secret
        run: |
          kubectl create namespace togglemaster --dry-run=client -o yaml | kubectl apply -f -

          AUTH_HOST=$(aws rds describe-db-instances \
            --db-instance-identifier togglemaster-auth \
            --region ${{ env.AWS_REGION }} \
            --query "DBInstances[0].Endpoint.Address" \
            --output text)

          kubectl create secret generic auth-service-secret \
            --namespace togglemaster \
            --from-literal=DB_USER_AUTH="postgres" \
            --from-literal=DB_PASSWORD_AUTH="${{ secrets.RDS_PASSWORD }}" \
            --from-literal=DATABASE_URL_AUTH="postgres://postgres:${{ secrets.RDS_PASSWORD }}@${AUTH_HOST}:5432/auth?sslmode=disable" \
            --from-literal=DB_URL_AUTH ="${{secrets.DB_URL_AUTH}}" \
            --from-literal=MASTER_KEY="${{ secrets.MASTER_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

  # ============================================
  # JOB 3: Atualizar Manifests GitOps (Kustomize)
  # ============================================
  update-gitops:
    name: 📝 Update GitOps Manifests
    runs-on: ubuntu-latest
    needs: [build-and-push, sync-secret]
    
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 🔧 Setup Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
      
      - name: 📝 Update image tag in kustomization
        env:
          ECR_REGISTRY: ${{ needs.build-and-push.outputs.ecr-registry }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image-tag }}
        run: |
          cd ${{ env.KUSTOMIZE_OVERLAY_PATH }}
          
          # Atualiza a tag da imagem no kustomization.yaml
          kustomize edit set image \
            $ECR_REGISTRY/$ECR_REPOSITORY=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          
          echo "✅ Kustomization updated:"
          cat kustomization.yaml
      
      - name: 💾 Commit and push changes
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image-tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add ${{ env.KUSTOMIZE_OVERLAY_PATH }}/kustomization.yaml
          
          if git diff --staged --quiet; then
            echo "⚠️ No changes to commit"
          else
            git commit -m "chore(gitops): update auth-service image to $IMAGE_TAG"
            git push origin main
          fi

  # ============================================
  # JOB 4: Validar Manifests
  # ============================================
  validate-manifests:
    name: ✅ Validate Manifests
    runs-on: ubuntu-latest
    needs: update-gitops
    
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4
        with:
          ref: main
      
      - name: 🔧 Setup Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
      
      - name: ✅ Validate Kubernetes manifests
        run: |
          cd ${{ env.KUSTOMIZE_OVERLAY_PATH }}
          kustomize build . > /dev/null
          echo "✅ Manifests are valid"